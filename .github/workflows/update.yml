name: Sync casks
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -B -m scripts.sync
      - name: Commit updated casks
        run: |
          git add Casks/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync casks" --trailer "Co-authored-by: Rajaniraiyn <72294760+Rajaniraiyn@users.noreply.github.com>"
            git push
          fi

  review-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      casks: ${{ steps.list.outputs.casks }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: list
        run: |
          echo "casks=$(python3 -B -m scripts.review --list)" >> "$GITHUB_OUTPUT"

  review:
    needs: review-index
    if: ${{ needs.review-index.outputs.casks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        cask: ${{ fromJSON(needs.review-index.outputs.casks) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare candidate
        env:
          CASK: ${{ matrix.cask }}
        run: python3 -B -m scripts.review "$CASK"
      - id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare review instructions
        if: steps.changes.outputs.changed == 'true'
        env:
          CASK: ${{ matrix.cask }}
        run: python3 -B -m scripts.review --instructions "$CASK" > "$RUNNER_TEMP/review.md"
      - uses: peter-evans/create-pull-request@v8.1.3
        if: steps.changes.outputs.changed == 'true'
        with:
          branch: automation/review-${{ matrix.cask }}
          title: "Review ${{ matrix.cask }} update"
          commit-message: |
            Prepare ${{ matrix.cask }} update for review

            Co-authored-by: Rajaniraiyn <72294760+Rajaniraiyn@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          body-path: ${{ runner.temp }}/review.md
