name: Update Spotify
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update.py
      - name: Commit updated pin
        run: |
          if ! git diff --quiet -- Casks/spotify.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/spotify.rb
            git commit -m "Update Spotify and SpotX"
            git push
          fi
